# Dovecot 2.4, one account, Maildir, the clear on 143 and 110 and TLS on 993 and
# 995 — moved to the ports the harness publishes. The account is the one Postfix
# delivers to, so a message accepted by SMTP is the message IMAP and POP3 serve.
# Started by scripts/interop/services.sh with -c, on its own base_dir, so it
# never touches a Dovecot the machine already runs.

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap pop3
listen = 127.0.0.1

base_dir = /var/tmp/moonmail-interop/run
state_dir = /var/tmp/moonmail-interop/state
log_path = /var/tmp/moonmail-interop/dovecot.log
info_log_path = /var/tmp/moonmail-interop/dovecot-info.log

ssl = yes
ssl_server_cert_file = /var/tmp/moonmail-interop/certs/cert.pem
ssl_server_key_file = /var/tmp/moonmail-interop/certs/key.pem
ssl_min_protocol = TLSv1.2
auth_allow_cleartext = yes
auth_mechanisms = plain login

login_greeting = moonmail interop ready

mail_driver = maildir
mail_home = /var/tmp/moonmail-interop/mail/%{user | username}
mail_path = %{home}/Maildir
mail_uid = 5000
mail_gid = 5000
mail_privileged_group = mail
first_valid_uid = 500

namespace inbox {
  inbox = yes
  separator = /
}

passdb passwd-file {
  default_password_scheme = PLAIN
  auth_username_format = %{user}
  passwd_file_path = /var/tmp/moonmail-interop/conf/users
}

userdb passwd-file {
  auth_username_format = %{user}
  passwd_file_path = /var/tmp/moonmail-interop/conf/users
  fields {
    uid = 5000
    gid = 5000
    home = /var/tmp/moonmail-interop/mail/%{user}
  }
}

service imap-login {
  inet_listener imap {
    port = 1143
  }
  inet_listener imaps {
    port = 1993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 1111
  }
  inet_listener pop3s {
    port = 1995
    ssl = yes
  }
}
