name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          # imap-server is a server: it runs until it is killed, so the
          # interop job is where it is exercised.
          for dir in src/examples/*/; do
            if [ "$dir" = "src/examples/imap-server/" ]; then continue; fi
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      # dkimpy shares no code with this library, so the two directions are what
      # says RFC 6376 was read the same way twice: its signatures verified here,
      # which is the vectors the test replays, and this library's verified
      # there, which is the example signing for it.
      - name: dkim, both directions with dkimpy
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --quiet --break-system-packages dkimpy pynacl
          python3 scripts/gen_dkim_vectors.py --check
          python3 scripts/dkim_interop.py

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

  # A real Dovecot and a real Postfix, then the sockets in @moonmail/net against
  # them: SMTP into Postfix, local(8) into a Maildir, IMAP and POP3 back out of
  # Dovecot. imaptest is the same Dovecot team's IMAP client, so the mailbox it
  # fills is what the header fetch test reads back.
  interop:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install the reference services
        run: |
          echo "postfix postfix/main_mailer_type select Local only" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            dovecot-imapd dovecot-pop3d dovecot-core postfix
          dovecot --version
          postconf -d mail_version
          # The sink. Pinned by version rather than by `latest`, so the flags in
          # services.sh are the ones this workflow was written against.
          curl -fsSL -o "$RUNNER_TEMP/mailpit.tar.gz" \
            https://github.com/axllent/mailpit/releases/download/v1.32.0/mailpit-linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/mailpit.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/mailpit" /usr/local/bin/mailpit
          mailpit version

      - name: start them
        run: sudo scripts/interop/services.sh start | tee -a "$GITHUB_ENV"

      - name: imaptest
        run: |
          # Pinned by content: the release tag moves, the binary this workflow
          # was written against does not.
          curl -fsSL -o "$RUNNER_TEMP/imaptest" \
            https://github.com/dovecot/imaptest/releases/download/latest/imaptest-x86_64-ubuntu-24.04
          echo "a4eb7e8dbf142b392c9f160c3c72c12d45cf544735da2585ccdf8ab333978147  $RUNNER_TEMP/imaptest" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/imaptest"
          python3 scripts/interop/write_mbox.py "$RUNNER_TEMP/imaptest.mbox" 20
          "$RUNNER_TEMP/imaptest" \
            host=127.0.0.1 port=1143 user=mailtest pass=secret \
            mbox="$RUNNER_TEMP/imaptest.mbox" msgs=20 clients=6 secs=45 \
            | tee "$RUNNER_TEMP/imaptest.log"
          # imaptest reports failures on stdout and still exits 0.
          if grep -E '^Error' "$RUNNER_TEMP/imaptest.log"; then exit 1; fi

      # The other side of the same tool: the server this library builds, with
      # imaptest — the Dovecot project's own client — pointed at it. The server
      # is started and stopped inside each step that uses it: a process left
      # behind by one step is not there for the next.
      - name: imaptest against our own server
        run: |
          # `moon run` builds and starts in one step, so nothing here depends on
          # where the toolchain puts the binary.
          moon run --target native src/examples/imap-server -- 1142 127.0.0.1 \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'pkill -P $server 2>/dev/null; kill $server 2>/dev/null' EXIT
          for i in $(seq 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1142) 2>/dev/null; then break; fi
            if ! kill -0 "$server" 2>/dev/null; then
              echo "::error::the server exited before it listened"
              cat "$RUNNER_TEMP/server.log"
              exit 1
            fi
            sleep 1
          done
          if ! (exec 3<>/dev/tcp/127.0.0.1/1142) 2>/dev/null; then
            echo "::error::nothing is listening on 1142"
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
          python3 scripts/interop/write_mbox.py "$RUNNER_TEMP/ours.mbox" 20
          "$RUNNER_TEMP/imaptest" \
            host=127.0.0.1 port=1142 user=tim pass=secret \
            mbox="$RUNNER_TEMP/ours.mbox" msgs=20 clients=2 secs=20 \
            > "$RUNNER_TEMP/ours.log" 2>&1
          tail -20 "$RUNNER_TEMP/ours.log"
          # imaptest reports what it finds on stdout and exits 0 either way, so
          # the finding is repeated as an annotation, where it can be read
          # without the run log.
          if grep -a -E '^Error' "$RUNNER_TEMP/ours.log"; then
            grep -a -E '^Error' "$RUNNER_TEMP/ours.log" | head -3 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: the sockets against them
        env:
          MOONMAIL_IMAPTEST: 20
          MOONMAIL_IMAP_SERVER: 127.0.0.1:1142
        run: |
          moon run --target native src/examples/imap-server -- 1142 127.0.0.1 &
          server=$!
          trap 'pkill -P $server 2>/dev/null; kill $server 2>/dev/null' EXIT
          for i in $(seq 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1142) 2>/dev/null; then break; fi
            sleep 1
          done
          set +e
          moon test --target native -p moonbitstack/moonmail/net 2>&1 | tee "$RUNNER_TEMP/tests.log"
          exit "${PIPESTATUS[0]}"

      - name: keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: |
            ${{ runner.temp }}/ours.log
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/tests.log
          if-no-files-found: warn

      - name: stop them
        if: always()
        run: |
          sudo sh -x scripts/interop/services.sh stop 2>&1 | tee "$RUNNER_TEMP/teardown.log"
          exit "${PIPESTATUS[0]}"

      - name: keep the teardown trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teardown
          path: ${{ runner.temp }}/teardown.log

      - name: logs when something went wrong
        if: failure()
        run: |
          sudo cat /var/tmp/moonmail-interop/dovecot.log || true
          sudo cat /var/tmp/moonmail-interop/postfix.log || true
