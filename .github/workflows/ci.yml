name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: deliver to Mailpit
        if: runner.os == 'Linux'
        run: |
          python3 scripts/write_test_certs.py "$RUNNER_TEMP/mailpit"
          echo "tim:secret" > "$RUNNER_TEMP/mailpit/auth.txt"
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 -p 1110:1110 -v "$RUNNER_TEMP/mailpit:/certs:ro" axllent/mailpit:v1.32.0 --smtp-tls-cert /certs/cert.pem --smtp-tls-key /certs/key.pem --smtp-auth-accept-any --smtp-auth-allow-insecure --pop3 0.0.0.0:1110 --pop3-auth-file /certs/auth.txt
          for i in $(seq 30); do curl -fs http://127.0.0.1:8025/api/v1/messages > /dev/null && break; sleep 1; done
          MAILPIT=127.0.0.1:1025:8025:1110 moon test --target native -p moonbitstack/moonmail/net

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

  # A real Dovecot and a real Postfix, then the sockets in @moonmail/net against
  # them: SMTP into Postfix, local(8) into a Maildir, IMAP and POP3 back out of
  # Dovecot. imaptest is the same Dovecot team's IMAP client, so the mailbox it
  # fills is what the header fetch test reads back.
  interop:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install the reference services
        run: |
          echo "postfix postfix/main_mailer_type select Local only" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            dovecot-imapd dovecot-pop3d dovecot-core postfix
          dovecot --version
          postconf -d mail_version

      - name: start them
        run: sudo scripts/interop/services.sh start | tee -a "$GITHUB_ENV"

      - name: imaptest
        run: |
          # Pinned by content: the release tag moves, the binary this workflow
          # was written against does not.
          curl -fsSL -o "$RUNNER_TEMP/imaptest" \
            https://github.com/dovecot/imaptest/releases/download/latest/imaptest-x86_64-ubuntu-24.04
          echo "a4eb7e8dbf142b392c9f160c3c72c12d45cf544735da2585ccdf8ab333978147  $RUNNER_TEMP/imaptest" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/imaptest"
          python3 scripts/interop/write_mbox.py "$RUNNER_TEMP/imaptest.mbox" 20
          "$RUNNER_TEMP/imaptest" \
            host=127.0.0.1 port=1143 user=mailtest pass=secret \
            mbox="$RUNNER_TEMP/imaptest.mbox" msgs=20 clients=6 secs=45 \
            | tee "$RUNNER_TEMP/imaptest.log"
          # imaptest reports failures on stdout and still exits 0.
          if grep -E '^Error' "$RUNNER_TEMP/imaptest.log"; then exit 1; fi

      - name: the sockets against them
        env:
          MOONMAIL_IMAPTEST: 20
        run: moon test --target native -p moonbitstack/moonmail/net

      - name: stop them
        if: always()
        run: sudo scripts/interop/services.sh stop

      - name: logs when something went wrong
        if: failure()
        run: |
          sudo cat /var/tmp/moonmail-interop/dovecot.log || true
          sudo cat /var/tmp/moonmail-interop/postfix.log || true
